plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.3.0'
}

application {
    mainClass = 'cn.chuanwise.xiaoming.qq.QqBotMain'
}

dependencies {
    implementation project(':api')
    implementation project(':core')
    implementation 'io.github.kloping:bot-qqpd-java:1.5.3-L2'
    implementation files('../libs/WiseToolkit-4.0.1-SNAPSHOT.jar')
    implementation 'net.mamoe:mirai-core-api-jvm:2.16.0'
}

shadowJar {
    manifest {
        attributes(
                'Main-Class': 'cn.chuanwise.xiaoming.qq.QqBotMain',
                'Build-JDK-Version': '17',
                'Build-Version': '5.0.0',
                'group': 'cn.chuanwise.xiaoming',
                'build-by': 'qfys521'
        )
    }
    mergeServiceFiles()
}
